name: CI

on:
  pull_request:
    branches: [main, upgrade, staging]
  push:
    branches: [main, upgrade, staging]
  # Callable so the staging deploy can gate on the same suite rather than
  # keeping a second, drifting copy of it.
  workflow_call:

# A second push to the same branch cancels the first — no point finishing a run
# for a commit nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # The migrations create their own extensions (uuid-ossp, pg_trgm), so
        # the stock image needs no preparation.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sm_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        # Not `npm run lint` — that script carries `--fix`, so in CI it would
        # silently rewrite the working tree and exit 0, making the gate
        # incapable of ever failing.
        #
        # `continue-on-error` because this repository has pre-existing lint
        # violations that predate the pipeline; failing on them would block
        # every pull request from day one. The step still reports, so the
        # number is visible and can be driven down. Remove this line once the
        # baseline is clean.
        continue-on-error: true
        run: npx eslint src e2e --ext .ts

      - name: Build
        run: npm run build

      - name: Migrate
        # Runs against the throwaway service database, proving the migrations
        # apply from nothing on every commit — which is how they will have to
        # apply to a new environment.
        run: |
          set -a && . ./.env.ci && set +a
          npx typeorm migration:run -d dist/database/data-source.js

      - name: End-to-end API tests
        # Guarded on the suite existing: `main` predates it, so an unguarded
        # step would fail every push to main until this branch merges.
        if: hashFiles('playwright.config.ts') != ''
        run: |
          set -a && . ./.env.ci && set +a
          npx playwright test

      - name: Upload test artefacts
        if: failure() && hashFiles('playwright.config.ts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            e2e-server.log
          retention-days: 7
