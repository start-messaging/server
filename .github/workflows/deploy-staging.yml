name: Deploy staging

# Staging tracks the `staging` branch. Nothing here runs off `main`: this
# workflow can restart a process and run migrations, and the production API
# shares a host with it, so it is deliberately impossible to point at prod by
# pushing to the wrong branch.
on:
  # Manual only. Auto-deploy on push was switched off on 2026-09-23: work
  # lands directly on `main` now and every environment is released by hand,
  # so a push must never move a running environment on its own.
  workflow_dispatch:

# Never two deploys at once — the second would build into the same directory
# while the first is still reading it. Not cancel-in-progress: a half-finished
# deploy that gets killed leaves the app down.
concurrency:
  group: deploy-staging-server
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      - name: Open an SSH session to the staging host
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # The backup script travels from this workflow's own checkout, so the box
      # always runs the version this file was written against.
      - name: Check out the on-box backup script
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy

      # A pre-deploy dump, but only on a box with the on-box backup layout
      # (/srv/sms/staging/backups: the EC2 box, where staging's Postgres is
      # local and the box bootstrap set it up). The old box has no such
      # directory, and there staging keeps deploying exactly as it always has,
      # without one. Where the layout exists a failed dump stops the deploy,
      # because the migrations below are what it would be needed for.
      - name: Dump the staging database on the box (EC2 box only)
        env:
          SSH_TARGET: ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Copied into a temp file on the box and run from there rather than
          # piped into `bash -s`, where any command that read stdin would
          # swallow the rest of the script. stdout is the dump's path only.
          rc=0
          ssh -i ~/.ssh/deploy.pem "$SSH_TARGET" \
            "if [ ! -d /srv/sms/staging/backups ]; then echo 'no /srv/sms/staging/backups here: not the EC2 box, so no pre-deploy dump' >&2; exit 0; fi; f=\$(mktemp) && cat >\"\$f\" && bash \"\$f\" staging pre-deploy-run$RUN_NUMBER; rc=\$?; rm -f \"\$f\"; exit \$rc" \
            < deploy/backup-db.sh > dump.out || rc=$?
          DUMP=$(tail -n 1 dump.out || true)
          case "$rc" in
            0) ;;
            3) echo "::warning::The pre-deploy dump is on the box, but its copy to the backup bucket failed (see the log above)." ;;
            *) echo "::error::The on-box pre-deploy dump failed (exit $rc). Nothing was deployed."; exit 1 ;;
          esac
          if [ -n "$DUMP" ]; then
            echo "Pre-deploy dump: $DUMP"
            echo "### Pre-deploy dump"$'\n'"\`$DUMP\` on the box." >> "$GITHUB_STEP_SUMMARY"
          fi

      # One script, run remotely, so the deploy is a single unit that either
      # finishes or leaves the previous release running.
      - name: Build and release
        run: |
          ssh -i ~/.ssh/deploy.pem "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd ~/server-staging

          PREV=$(git rev-parse HEAD)
          git fetch --quiet origin staging
          git checkout --quiet staging
          git reset --quiet --hard origin/staging

          # The box has 2 GB of RAM and runs production alongside this, so the
          # build is capped rather than left to grow into the production
          # process's memory.
          export NODE_OPTIONS=--max-old-space-size=640

          # Only reinstall when the lockfile actually changed. `npm ci` deletes
          # node_modules before repopulating it, and the still-running process
          # lazy-requires modules mid-request — so an unconditional ci meant
          # every code-only deploy threw "Cannot find module" and 502'd for the
          # length of the install. Most deploys do not touch dependencies, so
          # most now skip this entirely; when the lockfile does change there is
          # a brief window, which for staging is acceptable.
          if ! git diff --quiet "$PREV" HEAD -- package-lock.json; then
            echo "lockfile changed — reinstalling dependencies"
            npm ci --no-audit --no-fund
          else
            echo "dependencies unchanged — skipping install"
          fi

          # nest build replaces dist/*.js, but the running process has already
          # required them into memory, so replacing the files does not disturb
          # it until the restart below.
          npm run build

          # Migrations run before the restart, so the new code never meets an
          # old schema. They are transactional, so a failure here stops the
          # deploy with the previous release still serving.
          npm run migration:run

          pm2 restart startmessaging-staging --update-env
          REMOTE

      - name: Prove it came back up
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ secrets.STAGING_API_URL }}/health" || true)
            if [ "$code" = "200" ]; then
              echo "staging healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "staging did not return a healthy /health within 30s"
          ssh -i ~/.ssh/deploy.pem "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" \
            'pm2 logs startmessaging-staging --lines 40 --nostream'
          exit 1
